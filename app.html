<!DOCTYPE html>
<html>
<head>
<title>My To-Do List</title>
<style>
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;padding-top:50px}
.box{background:white;padding:25px;border-radius:15px;width:350px;box-shadow:0 5px 15px rgba(0,0,0,0.2)}
h2{text-align:center}
input{padding:10px;width:70%}
button{padding:10px;background:#6c5ce7;color:white;border:none;border-radius:5px;cursor:pointer}
li{list-style:none;background:#f8f9fa;padding:10px;margin-top:10px;border-radius:8px;display:flex;justify-content:space-between}
.done{text-decoration:line-through;color:gray}
</style>
</head>
<body>
<div class="box">
<h2>📝 My Daily To-Do</h2>
<input id="taskInput" placeholder="Add new task...">
<button onclick="addTask()">Add</button>
<button onclick="clearAll()" style="background:#ff7675;margin-top:10px">Clear All</button>
<ul id="taskList"></ul>
</div>
<script>
function addTask(){
  let input = document.getElementById("taskInput");
  let text = input.value.trim();
  if(text === "") return;
  let li = document.createElement("li");
  li.innerHTML = `<span onclick="this.classList.toggle('done')">${text}</span> <span onclick="this.parentElement.remove()" style="cursor:pointer;color:red">X</span>`;
  document.getElementById("taskList").appendChild(li);
  input.value = "";
}
function clearAll(){ document.getElementById("taskList").innerHTML = ""; }
</script>
</body>
</html>
